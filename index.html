<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schoolbot – Order &amp; Delivery</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --card:#fff; --accent:#2563eb; --ok:#15803d; --bad:#b91c1c; --muted:#6b7280; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#f3f4f6; --card:#1b2027; --accent:#60a5fa; --ok:#4ade80; --bad:#f87171; --muted:#9ca3af; --line:#2d3540; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  .banner { background:var(--accent); color:#fff; text-align:center; padding:12px 16px; font-weight:600; }
  header.hero { min-height:70vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:32px 16px; }
  header.hero h1 { font-size:2.4rem; margin:0 0 8px; }
  header.hero p { color:var(--muted); max-width:34rem; margin:0; }
  .scroll { margin-top:28px; color:var(--muted); font-size:.9rem; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .item h2 { margin:0; font-size:1.2rem; }
  .price { font-size:1.6rem; font-weight:700; }
  button { font:inherit; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px 18px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input[type=text] { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .hidden { display:none; }
  .result { margin-top:16px; padding:14px; border-radius:10px; border:1px solid var(--line); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .opt { display:flex; gap:10px; align-items:center; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:10px; }
  .opt input { width:auto; }
  small { color:var(--muted); }
</style>
</head>
<body>

<div class="banner">🚚 Delivery available — depending on your destination</div>

<header class="hero">
  <h1>Schoolbot</h1>
  <p>Fresh orders delivered from ZIP code 19149. Delivery is available depending on how far you are from us — scroll down to check yours.</p>
  <div class="scroll">▼ Scroll down to order</div>
</header>

<main>
  <section class="card">
    <div class="item">
      <div>
        <h2 id="itemName">Featured Item</h2>
        <small>Ships from ZIP 19149</small>
      </div>
      <div class="price">$70</div>
    </div>
    <button id="orderBtn" style="margin-top:16px;width:100%">Order here</button>
  </section>

  <section class="card hidden" id="orderForm">
    <h2 style="margin-top:0">Where should we deliver?</h2>
    <form id="form" autocomplete="on">
      <label for="street">Home address</label>
      <input id="street" type="text" required placeholder="123 Main St" autocomplete="street-address">
      <div class="row">
        <div><label for="city">City</label><input id="city" type="text" required autocomplete="address-level2"></div>
        <div><label for="zip">ZIP code</label><input id="zip" type="text" required inputmode="numeric" pattern="\d{5}" maxlength="5" autocomplete="postal-code"></div>
      </div>
      <button id="checkBtn" type="submit" style="margin-top:16px;width:100%">Check delivery &amp; arrival time</button>
    </form>

    <div id="result" class="result hidden"></div>
    <div id="choices" class="hidden">
      <label class="opt"><input type="radio" name="method" value="delivery" checked> <span><strong>Delivery</strong><br><small id="deliveryInfo"></small></span></label>
      <button id="confirmBtn" style="margin-top:16px;width:100%">Place order – $70</button>
    </div>
    <div id="done" class="result ok hidden"></div>
  </section>
</main>

<script>
(function () {
  var ORIGIN_ZIP = "19149";
  var MAX_MILES = 25;        // delivery radius
  var PREP_MIN = 20;         // time to prepare the order
  var MIN_PER_MILE = 3;      // average driving minutes per mile
  var $ = function (id) { return document.getElementById(id); };
  var miles = null, eta = null;

  $("orderBtn").onclick = function () {
    $("orderForm").classList.remove("hidden");
    $("orderForm").scrollIntoView({ behavior: "smooth" });
    $("street").focus();
  };

  function zipToLatLon(zip) {
    return fetch("https://api.zippopotam.us/us/" + zip).then(function (r) {
      if (!r.ok) throw new Error("ZIP not found");
      return r.json();
    }).then(function (d) {
      return { lat: parseFloat(d.places[0].latitude), lon: parseFloat(d.places[0].longitude) };
    });
  }

  function haversine(a, b) {
    var R = 3958.8, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    var h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function fmtTime(d) { return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

  $("form").onsubmit = function (e) {
    e.preventDefault();
    var zip = $("zip").value.trim();
    var res = $("result"), btn = $("checkBtn");
    btn.disabled = true; btn.textContent = "Checking…";
    $("choices").classList.add("hidden"); $("done").classList.add("hidden");
    res.classList.remove("hidden");
    res.textContent = "Calculating distance from " + ORIGIN_ZIP + "…";

    Promise.all([zipToLatLon(ORIGIN_ZIP), zipToLatLon(zip)]).then(function (p) {
      // Straight-line distance x1.3 approximates road distance.
      miles = haversine(p[0], p[1]) * 1.3;
      if (miles > MAX_MILES) {
        res.innerHTML = '<strong class="bad">Delivery not available</strong><br>You are about ' +
          miles.toFixed(1) + ' miles from ZIP ' + ORIGIN_ZIP + '. We deliver within ' + MAX_MILES + ' miles.';
        return;
      }
      var mins = Math.round(PREP_MIN + miles * MIN_PER_MILE);
      var arrive = new Date(Date.now() + mins * 60000);
      eta = { mins: mins, arrive: arrive };
      res.innerHTML = '<strong class="ok">Delivery available!</strong><br>About ' + miles.toFixed(1) +
        ' miles from ZIP ' + ORIGIN_ZIP + '.<br>Estimated arrival: <strong>' + mins + ' min (around ' + fmtTime(arrive) + ')</strong>';
      $("deliveryInfo").textContent = "Arrives in about " + mins + " min · free delivery";
      $("choices").classList.remove("hidden");
    }).catch(function () {
      res.innerHTML = '<strong class="bad">Could not look up that ZIP code.</strong> Please check it and try again.';
    }).then(function () {
      btn.disabled = false; btn.textContent = "Check delivery & arrival time";
    });
  };

  $("confirmBtn").onclick = function () {
    var done = $("done");
    done.classList.remove("hidden");
    done.innerHTML = "✅ Order placed for delivery to " + $("street").value + ", " + $("city").value + " " + $("zip").value +
      ". Estimated arrival: " + eta.mins + " min (around " + fmtTime(eta.arrive) + "). Total: $70.";
    $("choices").classList.add("hidden");
  };
})();
</script>
</body>
</html>
